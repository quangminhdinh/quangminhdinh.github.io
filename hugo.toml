baseURL = "https://quangminhdinh.github.io/"
languageCode = "en-us"
title = "Quang Minh Dinh"
theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

pygmentsUseClasses = true

[services]
  [services.googleAnalytics]
    ID = "G-MD1K8SMKDW"

[minify]
  disableXML = true
  minifyOutput = true

[pagination]
  pagerSize = 10

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)'], ['$', '$']]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "monokai"

[params]
  env = "production"
  title = "Quang Minh Dinh"
  description = "Incoming PhD student interested in world models and multi-agent social interaction."
  keywords = ["Quang Minh Dinh", "PhD", "world models", "machine learning", "computer vision"]
  author = "Quang Minh Dinh"
  DateFormat = "Jan 2, 2006"
  defaultTheme = "auto"
  disableThemeToggle = false

  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  ShowToc = false
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false

  [params.homeInfoParams]
    Title = "Hi, I'm Minh 👋"
    imageUrl = "images/profile.jpg"
    imageTitle = "Quang Minh Dinh"
    Content = """
I'm interested in **world models** and **multi-agent social interaction**: how agents can maintain a shared understanding of their environment so that planning, coordination, and social behaviour feel seamless and lifelike rather than scripted.

I completed my B.Sc. in Computing Science with Distinction at **Simon Fraser University**, where I work with [Angelica Lim](https://angelicalim.com/) at [Rosie Lab](https://www.rosielab.ca/) on real-time non-verbal human–robot interaction, and previously with [Ke Li](https://www.sfu.ca/~keli/) at [APEX Lab](https://sfuapex.ca/) on text-conditional generative models. Before SFU, I interned at **Huawei** on real-time acoustic echo cancellation, which grew into my first-author paper at Interspeech 2025.
"""

  [[params.socialIcons]]
    name = "email"
    title = "Email"
    url = "mailto:qmd@sfu.ca"
  [[params.socialIcons]]
    name = "github"
    title = "GitHub"
    url = "https://github.com/quangminhdinh"
  [[params.socialIcons]]
    name = "linkedin"
    title = "LinkedIn"
    url = "https://www.linkedin.com/in/quang-minh-dinh/"
  [[params.socialIcons]]
    name = "googlescholar"
    title = "Google Scholar"
    url = "https://scholar.google.com/citations?user=-OE2rAYAAAAJ"
  [[params.socialIcons]]
    name = "cv"
    title = "CV"
    url = "/cv.pdf"

  [params.assets]
    disableHLJS = true
    disableFingerprinting = false
    favicon = "/favicon.ico"
    theme_color = "#1d1e20"
    msapplication_TileColor = "#ffffff"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

[[menu.main]]
